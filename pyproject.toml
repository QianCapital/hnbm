[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hnbm"
dynamic = ["version"]
description = "Heterogeneous Newton Boosting Machine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Qian Capital", email = "samson.qian@qiancapital.com"}]
keywords = ["boosting", "gradient-boosting", "hnbm", "heterogeneous-newton"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "joblib>=1.0",
    "numpy>=1.20",
    "scikit-learn>=1.0",
    "tqdm>=4.50",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-cov>=4", "pandas>=1.3"]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pandas>=1.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/qiancapital/hnbm"
Repository = "https://github.com/qiancapital/hnbm"

[tool.setuptools.dynamic]
version = {attr = "hnbm.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["hnbm*"]

[tool.setuptools.package-data]
hnbm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["hnbm"]
branch = true

[tool.coverage.report]
show_missing = true
# Ratchet: raise this as coverage improves, never lower it.
fail_under = 83

[tool.ruff]
line-length = 88
target-version = "py38"
extend-exclude = ["static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["hnbm"]
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
