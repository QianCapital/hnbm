[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hnbm"
dynamic = ["version"]
description = "Heterogeneous Newton Boosting Machine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "Qian Capital", email = "samson.qian@qiancapital.com"}]
keywords = ["boosting", "gradient-boosting", "hnbm", "heterogeneous-newton"]
dependencies = [
    "joblib>=1.0",
    "numpy>=1.20",
    "scikit-learn>=1.0",
    "tqdm>=4.50",
]

[project.optional-dependencies]
test = ["pytest>=7", "pandas>=1.3"]
dev = [
    "pytest>=7",
    "pandas>=1.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/qiancapital/hnbm"
Repository = "https://github.com/qiancapital/hnbm"

[tool.setuptools.dynamic]
version = {attr = "hnbm.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["hnbm*"]

[tool.setuptools.package-data]
hnbm = ["py.typed"]
